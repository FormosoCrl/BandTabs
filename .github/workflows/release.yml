name: Release

# Compila el instalador de Windows y lo deja como borrador privado en Releases (no se publica;
# se descarga de ahí para subirlo a la tienda). Dos formas:
# - subir una etiqueta: git tag v0.2.0 && git push --tags
# - desde GitHub: Actions → Release → Run workflow, escribiendo la versión (crea la etiqueta).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar, sin la v (p. ej. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          releaseName: BandTabs ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Descarga `BandTabs_..._x64-setup.exe`, ábrelo y listo. No hace falta instalar nada más.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
