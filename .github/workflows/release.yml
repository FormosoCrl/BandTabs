name: Release

# Publica el instalador de Windows al subir una etiqueta vX.Y.Z (git tag v0.2.0 && git push --tags).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: BandTabs ${{ github.ref_name }}
          releaseBody: |
            Descarga `BandTabs_..._x64-setup.exe`, ábrelo y listo. No hace falta instalar nada más.
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
